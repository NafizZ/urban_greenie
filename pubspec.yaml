name: urban_greenie
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  flutter_gen_runner: 5.3.1
  freezed: ^2.4.1
  flutter_lints: ^2.0.1


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/background_images/
    - assets/custom_icons/
    - assets/vector_images/
  generate: true

flutter_gen:
  output: lib/core/resource/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)



  assets:
    enabled: true

    outputs:
      class_name: GreenieAsset
      package_parameter_enabled: false
